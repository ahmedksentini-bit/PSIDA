<text x="40" y="34" text-anchor="start" font-size="16" font-weight="bold" fill="#111">Les sept procédés de pieux de PSIDA, regroupés en cinq familles (schémas de principe)</text><text x="175.0" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Foré simple</text><rect x="40" y="220" width="270" height="330" fill="#efe0a8" opacity="0.6"/><line x1="40" y1="220" x2="310" y2="220" stroke="#7a6a4f" stroke-width="2"/><rect x="147.0" y="220" width="56" height="230" fill="#fff" stroke="#222"/><line x1="175.0" y1="170" x2="175.0" y2="435" stroke="#555" stroke-width="5"/><path d="M151.0,290 L199.0,300" stroke="#555" stroke-width="3"/><path d="M151.0,310 L199.0,320" stroke="#555" stroke-width="3"/><path d="M151.0,330 L199.0,340" stroke="#555" stroke-width="3"/><path d="M151.0,350 L199.0,360" stroke="#555" stroke-width="3"/><path d="M151.0,370 L199.0,380" stroke="#555" stroke-width="3"/><path d="M151.0,390 L199.0,400" stroke="#555" stroke-width="3"/><path d="M151.0,410 L199.0,420" stroke="#555" stroke-width="3"/><path d="M151.0,430 L199.0,440" stroke="#555" stroke-width="3"/><text x="209.0" y="260" text-anchor="start" font-size="11" font-weight="normal" fill="#111">outil de forage</text><text x="40" y="570" text-anchor="start" font-size="11" font-weight="normal" fill="#111">outil (tarière, benne) ; parois sans soutien</text><text x="40" y="590" text-anchor="start" font-size="12" font-weight="bold" fill="#1f3a5f">sans refoulement</text><text x="465.0" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Foré boue</text><rect x="330" y="220" width="270" height="330" fill="#efe0a8" opacity="0.6"/><line x1="330" y1="220" x2="600" y2="220" stroke="#7a6a4f" stroke-width="2"/><rect x="437.0" y="220" width="56" height="230" fill="#c9d8e8" stroke="#222"/><rect x="437.0" y="370" width="56" height="80" fill="#bbb" stroke="#222"/><line x1="465.0" y1="180" x2="465.0" y2="390" stroke="#444" stroke-width="7"/><text x="499.0" y="280" text-anchor="start" font-size="11" font-weight="normal" fill="#1565c0">boue</text><text x="499.0" y="410" text-anchor="start" font-size="11" font-weight="normal" fill="#111">béton</text><text x="477.0" y="176" text-anchor="start" font-size="11" font-weight="normal" fill="#111">tube plongeur</text><text x="330" y="570" text-anchor="start" font-size="11" font-weight="normal" fill="#111">boue bentonitique ; béton au tube plongeur</text><text x="330" y="590" text-anchor="start" font-size="12" font-weight="bold" fill="#1f3a5f">sans refoulement</text><text x="755.0" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Foré tubé</text><rect x="620" y="220" width="270" height="330" fill="#efe0a8" opacity="0.6"/><line x1="620" y1="220" x2="890" y2="220" stroke="#7a6a4f" stroke-width="2"/><rect x="727.0" y="220" width="56" height="230" fill="#bbb" stroke="#222"/><rect x="721.0" y="190" width="6" height="190" fill="#455a64"/><rect x="783.0" y="190" width="6" height="190" fill="#455a64"/><line x1="795.0" y1="210" x2="795.0" y2="170" stroke="#222" marker-end="url(#ar)"/><text x="801.0" y="190" text-anchor="start" font-size="11" font-weight="normal" fill="#111">retiré</text><text x="795.0" y="350" text-anchor="start" font-size="11" font-weight="normal" fill="#111">tube</text><text x="620" y="570" text-anchor="start" font-size="11" font-weight="normal" fill="#111">tube provisoire (récupéré) ou virole perdue</text><text x="620" y="590" text-anchor="start" font-size="12" font-weight="bold" fill="#1f3a5f">sans refoulement</text><text x="1045.0" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Battu préfabriqué</text><rect x="910" y="220" width="270" height="330" fill="#efe0a8" opacity="0.6"/><line x1="910" y1="220" x2="1180" y2="220" stroke="#7a6a4f" stroke-width="2"/><rect x="1021.0" y="160" width="48" height="290" fill="#bbb" stroke="#222"/><polygon points="1021.0,450 1069.0,450 1045.0,482" fill="#555"/><rect x="1011.0" y="120" width="68" height="34" fill="#455a64"/><text x="1085.0" y="140" text-anchor="start" font-size="11" font-weight="normal" fill="#111">mouton</text><line x1="1015.0" y1="300" x2="987.0" y2="300" stroke="#b71c1c" stroke-width="2" marker-end="url(#ar)"/><line x1="1075.0" y1="300" x2="1103.0" y2="300" stroke="#b71c1c" stroke-width="2" marker-end="url(#ar)"/><line x1="1015.0" y1="345" x2="987.0" y2="345" stroke="#b71c1c" stroke-width="2" marker-end="url(#ar)"/><line x1="1075.0" y1="345" x2="1103.0" y2="345" stroke="#b71c1c" stroke-width="2" marker-end="url(#ar)"/><line x1="1015.0" y1="390" x2="987.0" y2="390" stroke="#b71c1c" stroke-width="2" marker-end="url(#ar)"/><line x1="1075.0" y1="390" x2="1103.0" y2="390" stroke="#b71c1c" stroke-width="2" marker-end="url(#ar)"/><line x1="1015.0" y1="435" x2="987.0" y2="435" stroke="#b71c1c" stroke-width="2" marker-end="url(#ar)"/><line x1="1075.0" y1="435" x2="1103.0" y2="435" stroke="#b71c1c" stroke-width="2" marker-end="url(#ar)"/><text x="1045.0" y="520" text-anchor="middle" font-size="11" font-weight="normal" fill="#b71c1c">sol refoulé et compacté</text><text x="910" y="570" text-anchor="start" font-size="11" font-weight="normal" fill="#111">pieu en béton enfoncé au mouton</text><text x="910" y="590" text-anchor="start" font-size="12" font-weight="bold" fill="#b71c1c">avec refoulement</text><text x="1335.0" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#111">Battu moulé, acier fermé</text><rect x="1200" y="220" width="270" height="330" fill="#efe0a8" opacity="0.6"/><line x1="1200" y1="220" x2="1470" y2="220" stroke="#7a6a4f" stroke-width="2"/><rect x="1311.0" y="160" width="48" height="290" fill="#90a4ae" stroke="#222"/><polygon points="1311.0,450 1359.0,450 1335.0,482" fill="#555"/><rect x="1301.0" y="120" width="68" height="34" fill="#455a64"/><text x="1375.0" y="140" text-anchor="start" font-size="11" font-weight="normal" fill="#111">mouton</text><line x1="1305.0" y1="300" x2="1277.0" y2="300" stroke="#b71c1c" stroke-width="2" marker-end="url(#ar)"/><line x1="1365.0" y1="300" x2="1393.0" y2="300" stroke="#b71c1c" stroke-width="2" marker-end="url(#ar)"/><line x1="1305.0" y1="345" x2="1277.0" y2="345" stroke="#b71c1c" stroke-width="2" marker-end="url(#ar)"/><line x1="1365.0" y1="345" x2="1393.0" y2="345" stroke="#b71c1c" stroke-width="2" marker-end="url(#ar)"/><line x1="1305.0" y1="390" x2="1277.0" y2="390" stroke="#b71c1c" stroke-width="2" marker-end="url(#ar)"/><line x1="1365.0" y1="390" x2="1393.0" y2="390" stroke="#b71c1c" stroke-width="2" marker-end="url(#ar)"/><line x1="1305.0" y1="435" x2="1277.0" y2="435" stroke="#b71c1c" stroke-width="2" marker-end="url(#ar)"/><line x1="1365.0" y1="435" x2="1393.0" y2="435" stroke="#b71c1c" stroke-width="2" marker-end="url(#ar)"/><text x="1335.0" y="520" text-anchor="middle" font-size="11" font-weight="normal" fill="#b71c1c">sol refoulé et compacté</text><text x="1200" y="570" text-anchor="start" font-size="11" font-weight="normal" fill="#111">tube fermé : retiré (moulé) ou laissé (acier)</text><text x="1200" y="590" text-anchor="start" font-size="12" font-weight="bold" fill="#b71c1c">avec refoulement</text><text x="40" y="625" text-anchor="start" font-size="12" font-weight="normal" fill="#111">Sans refoulement, le forage décomprime le sol sous la pointe : k<tspan baseline-shift='sub' font-size='9'>p</tspan> est plus faible ; avec refoulement, le pieu compacte le sol et la portance en pointe est meilleure.</text><text x="40" y="645" text-anchor="start" font-size="12" font-weight="normal" fill="#111">Le frottement latéral dépend surtout de l'interface pieu-sol (béton rugueux, tube lisse) : le foré boue peut frotter davantage qu'un pieu battu (manuel, § 15.1).</text></svg>