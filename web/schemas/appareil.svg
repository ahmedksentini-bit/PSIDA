<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="595.0" viewBox="0 0 1720 595.0" font-family="Liberation Sans, Arial, sans-serif" font-size="14">
<defs>
<pattern id="beton" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f2f2f2"/><circle cx="2" cy="2" r="0.9" fill="#999"/><circle cx="6" cy="5.5" r="0.7" fill="#999"/></pattern>
<pattern id="hach" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#666" stroke-width="1"/></pattern>
<pattern id="elast" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#dfe8f3"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="tk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#222" stroke-width="1.4"/></marker>
</defs><rect width="100%" height="100%" fill="white"/>
<text x="250" y="40" text-anchor="start" font-size="15" font-weight="bold" fill="#111">Appareil d'appui en élastomère fretté — coupe dans le sens a (perpendiculaire à la ligne d'appui)</text><rect x="250" y="110" width="1000.0" height="240.0" fill="url(#elast)" stroke="#222" stroke-width="1.6" rx="6"/><rect x="270.0" y="120.0" width="960.0" height="12.0" fill="#555"/><rect x="270.0" y="172.0" width="960.0" height="12.0" fill="#555"/><rect x="270.0" y="224.0" width="960.0" height="12.0" fill="#555"/><rect x="270.0" y="276.0" width="960.0" height="12.0" fill="#555"/><rect x="270.0" y="328.0" width="960.0" height="12.0" fill="#555"/><line x1="250" y1="350.0" x2="250.0" y2="390.0" stroke="#888" stroke-width="0.8"/><line x1="1250.0" y1="350.0" x2="1250.0" y2="390.0" stroke="#888" stroke-width="0.8"/><line x1="250.0" y1="390.0" x2="1250.0" y2="390.0" stroke="#222" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="750.0" y="384.0" text-anchor="middle" font-size="13" transform="rotate(0.0 750.0 384.0)" fill="#111">a</text><line x1="270.0" y1="350.0" x2="270.0" y2="428.0" stroke="#888" stroke-width="0.8"/><line x1="1230.0" y1="350.0" x2="1230.0" y2="428.0" stroke="#888" stroke-width="0.8"/><line x1="270.0" y1="428.0" x2="1230.0" y2="428.0" stroke="#222" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="750.0" y="422.0" text-anchor="middle" font-size="13" transform="rotate(0.0 750.0 422.0)" fill="#111">a′ (frettes)</text><line x1="1280.0" y1="110" x2="1280.0" y2="350.0" stroke="#222" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="1288.0" y="270.0" text-anchor="start" font-size="14" font-weight="normal" fill="#111">hauteur totale</text><line x1="1262.0" y1="132.0" x2="1262.0" y2="172.0" stroke="#c00" stroke-width="1.4" marker-start="url(#ar)" marker-end="url(#ar)"/><line x1="870.0" y1="152.0" x2="1310.0" y2="190.0" stroke="#444" stroke-width="0.9"/><circle cx="870.0" cy="152.0" r="2" fill="#444"/><text x="1314.0" y="195.0" text-anchor="start" font-size="14" font-weight="normal" fill="#111">feuillet d'élastomère t (× n)</text><line x1="650.0" y1="126.0" x2="1310.0" y2="90" stroke="#444" stroke-width="0.9"/><circle cx="650.0" cy="126.0" r="2" fill="#444"/><text x="1314.0" y="95" text-anchor="start" font-size="14" font-weight="normal" fill="#111">frette d'acier t_s (× n + 1)</text><line x1="252" y1="242.0" x2="230" y2="282.0" stroke="#444" stroke-width="0.9"/><circle cx="252" cy="242.0" r="2" fill="#444"/><text x="226" y="287.0" text-anchor="end" font-size="14" font-weight="normal" fill="#111">enrobage latéral</text><line x1="450.0" y1="115.0" x2="410.0" y2="92" stroke="#444" stroke-width="0.9"/><circle cx="450.0" cy="115.0" r="2" fill="#444"/><text x="406.0" y="97" text-anchor="end" font-size="14" font-weight="normal" fill="#111">enrobage e</text><text x="250" y="525.0" text-anchor="start" font-size="14" font-weight="normal" fill="#111">Désignation a × b × n(t + t_s) : n feuillets d'élastomère d'épaisseur t entre n + 1 frettes d'acier d'épaisseur t_s.</text><text x="250" y="547.0" text-anchor="start" font-size="14" font-weight="normal" fill="#111">Épaisseur d'élastomère : T_q = n t (cisaillement) ; T_e = n t + 2 e (flambement). Hauteur totale : T_e + (n + 1) t_s.</text><text x="250" y="569.0" text-anchor="start" font-size="14" font-weight="normal" fill="#111">Dimension b parallèle à la ligne d'appui. Exemple : 250 × 400 × 4(10 + 3) = 4 feuillets de 10 mm entre 5 frettes de 3 mm.</text></svg>