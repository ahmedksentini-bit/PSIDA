<svg xmlns="http://www.w3.org/2000/svg" width="1490" height="676" viewBox="0 0 1490 676" font-family="Liberation Sans, Arial, sans-serif" font-size="14">
<defs>
<pattern id="beton" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f2f2f2"/><circle cx="2" cy="2" r="0.9" fill="#999"/><circle cx="6" cy="5.5" r="0.7" fill="#999"/></pattern>
<pattern id="hach" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#666" stroke-width="1"/></pattern>
<pattern id="elast" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#dfe8f3"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker>
<marker id="tk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#222" stroke-width="1.4"/></marker>
</defs><rect width="100%" height="100%" fill="white"/>
<text x="40" y="34" text-anchor="start" font-size="16" font-weight="bold" fill="#111">Repère et conventions de signe de PSIDA</text><text x="40" y="66" text-anchor="start" font-size="14" font-weight="bold" fill="#111">a) vue en plan (y vers le haut, comme le schéma « Vue en plan » de l'onglet Projet)</text><rect x="97.0" y="104" width="1222" height="312" fill="#dfe6ef" stroke="#222" stroke-width="1.4"/><rect x="97.0" y="130" width="1222" height="260" fill="#c3cad6" stroke="none"/><line x1="110" y1="94" x2="110" y2="426" stroke="#0b5fa5" stroke-width="2" stroke-dasharray=""/><text x="110" y="444" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b5fa5">C0</text><line x1="474" y1="94" x2="474" y2="426" stroke="#0b5fa5" stroke-width="2" stroke-dasharray="7 4"/><text x="474" y="444" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b5fa5">P1</text><line x1="942" y1="94" x2="942" y2="426" stroke="#0b5fa5" stroke-width="2" stroke-dasharray="7 4"/><text x="942" y="444" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b5fa5">P2</text><line x1="1306" y1="94" x2="1306" y2="426" stroke="#0b5fa5" stroke-width="2" stroke-dasharray=""/><text x="1306" y="444" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b5fa5">Cn</text><line x1="97.0" y1="260" x2="1319.0" y2="260" stroke="#222" stroke-dasharray="8 4 2 4"/><line x1="110" y1="260" x2="240" y2="260" stroke="#b71c1c" stroke-width="3" marker-end="url(#ar)"/><text x="246" y="254" text-anchor="start" font-size="17" font-weight="bold" fill="#b71c1c">x</text><line x1="110" y1="260" x2="110" y2="156" stroke="#b71c1c" stroke-width="3" marker-end="url(#ar)"/><text x="118" y="160" text-anchor="start" font-size="17" font-weight="bold" fill="#b71c1c">y</text><circle cx="110" cy="260" r="4" fill="#b71c1c"/><text x="102" y="278" text-anchor="end" font-size="13" font-weight="normal" fill="#b71c1c">O</text><text x="1327.0" y="109" text-anchor="start" font-size="13" font-weight="normal" fill="#111">y = +b</text><text x="1327.0" y="421" text-anchor="start" font-size="13" font-weight="normal" fill="#111">y = −b</text><text x="1327.0" y="265" text-anchor="start" font-size="13" font-weight="normal" fill="#111">y = 0 (axe)</text><text x="1327.0" y="135" text-anchor="start" font-size="12" font-weight="normal" fill="#555">bord de chaussée y₂</text><text x="1327.0" y="395" text-anchor="start" font-size="12" font-weight="normal" fill="#555">bord de chaussée y₁</text><circle cx="255.6" cy="416" r="5" fill="#2e7d32"/><text x="255.6" y="90" text-anchor="middle" font-size="13" font-weight="normal" fill="#2e7d32">T1 : 0,4 L₁ (travée de rive)</text><line x1="255.6" y1="104" x2="255.6" y2="416" stroke="#2e7d32" stroke-width="1.2" stroke-dasharray="3 3"/><circle cx="708" cy="416" r="5" fill="#2e7d32"/><text x="708" y="90" text-anchor="middle" font-size="13" font-weight="normal" fill="#2e7d32">T2 : 0,5 L₂ (travée centrale)</text><line x1="708" y1="104" x2="708" y2="416" stroke="#2e7d32" stroke-width="1.2" stroke-dasharray="3 3"/><text x="480" y="408" text-anchor="start" font-size="12" font-weight="normal" fill="#2e7d32">bord libre : souvent la fibre la plus chargée</text><text x="40" y="506" text-anchor="start" font-size="14" font-weight="bold" fill="#111">b) signes</text><path d="M110,576 Q240,616 370,576" fill="none" stroke="#1f3a5f" stroke-width="16" stroke-linecap="butt" opacity="0.85"/><path d="M100,606 A30,30 0 0 1 100,546" fill="none" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><path d="M380,546 A30,30 0 0 1 380,606" fill="none" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><text x="240" y="636" text-anchor="middle" font-size="13" font-weight="normal" fill="#111">M > 0 : fibre inférieure tendue (travée)</text><text x="240" y="546" text-anchor="middle" font-size="13" font-weight="normal" fill="#b71c1c">M &lt; 0 : fibre supérieure tendue (sur appui)</text><rect x="560" y="526" width="140" height="100" fill="#dfe6ef" stroke="#222"/><line x1="700" y1="576" x2="770" y2="576" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><text x="774" y="581" text-anchor="start" font-size="14" font-weight="bold" fill="#111">x</text><line x1="630" y1="526" x2="630" y2="486" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><text x="636" y="492" text-anchor="start" font-size="14" font-weight="bold" fill="#111">y</text><line x1="570" y1="541" x2="690" y2="541" stroke="#b71c1c" stroke-width="2.5"/><line x1="570" y1="563" x2="690" y2="563" stroke="#b71c1c" stroke-width="2.5"/><line x1="570" y1="585" x2="690" y2="585" stroke="#b71c1c" stroke-width="2.5"/><line x1="570" y1="607" x2="690" y2="607" stroke="#b71c1c" stroke-width="2.5"/><text x="810" y="546" text-anchor="start" font-size="13" font-weight="normal" fill="#111">m<tspan baseline-shift='sub' font-size='10'>x</tspan> [kN·m/m] : moment longitudinal par mètre de largeur,</text><text x="810" y="564" text-anchor="start" font-size="13" font-weight="normal" fill="#111">équilibré par les aciers longitudinaux (traits rouges, // x)</text><text x="810" y="594" text-anchor="start" font-size="13" font-weight="normal" fill="#111">m<tspan baseline-shift='sub' font-size='10'>y</tspan> [kN·m/m] : moment transversal par mètre de longueur,</text><text x="810" y="612" text-anchor="start" font-size="13" font-weight="normal" fill="#111">équilibré par les aciers transversaux (// y)</text><text x="810" y="642" text-anchor="start" font-size="13" font-weight="normal" fill="#111">δ (tassement) > 0 vers le bas ; réactions R > 0 vers le haut</text></svg>