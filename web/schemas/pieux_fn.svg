<text x="40" y="34" text-anchor="start" font-size="16" font-weight="bold" fill="#111">Frottement négatif : le sol qui tasse tire le pieu vers le bas (culée)</text><rect x="140" y="200" width="760" height="68" fill="#c9b28f" opacity="0.6"/><text x="910" y="218" text-anchor="start" font-size="12" font-weight="normal" fill="#111">argile compressible (tasse sous le remblai)</text><rect x="140" y="268" width="760" height="204" fill="#efe0a8" opacity="0.6"/><text x="910" y="286" text-anchor="start" font-size="12" font-weight="normal" fill="#111">sable</text><rect x="140" y="472" width="760" height="289.0" fill="#b9c4c9" opacity="0.6"/><text x="910" y="490" text-anchor="start" font-size="12" font-weight="normal" fill="#111">marne</text><polygon points="140,200 460,200 460,193.2 526,193.2 526,67.4 260,67.4" fill="#e0d4b8" stroke="#7a6a4f"/><text x="220" y="132" text-anchor="start" font-size="13" font-weight="normal" fill="#111">remblai d'accès</text><text x="220" y="150" text-anchor="start" font-size="12" font-weight="normal" fill="#111">hauteur H<tspan baseline-shift='sub' font-size='9'>r</tspan></text><rect x="460" y="193.2" width="200" height="40.8" fill="url(#beton)" stroke="#222"/><text x="666" y="217.0" text-anchor="start" font-size="11" font-weight="normal" fill="#111">semelle</text><rect x="526" y="57.19999999999999" width="28" height="136.0" fill="url(#beton)" stroke="#222"/><text x="560" y="84.4" text-anchor="start" font-size="12" font-weight="normal" fill="#111">mur de front</text><rect x="506" y="234" width="28" height="510" fill="#d9d9d9" stroke="#222"/><line x1="220" y1="210.2" x2="220" y2="254.4" stroke="#7a6a4f" stroke-width="2" marker-end="url(#arB)"/><line x1="300" y1="210.2" x2="300" y2="254.4" stroke="#7a6a4f" stroke-width="2" marker-end="url(#arB)"/><line x1="380" y1="210.2" x2="380" y2="254.4" stroke="#7a6a4f" stroke-width="2" marker-end="url(#arB)"/><text x="150" y="262" text-anchor="start" font-size="12" font-weight="normal" fill="#7a6a4f">le sol tasse ↓</text><line x1="496" y1="234.5" x2="496" y2="250.5" stroke="#b71c1c" stroke-width="1.6" marker-end="url(#arR)"/><line x1="544" y1="234.5" x2="544" y2="250.5" stroke="#b71c1c" stroke-width="1.6" marker-end="url(#arR)"/><line x1="496" y1="251.5" x2="496" y2="267.5" stroke="#b71c1c" stroke-width="1.6" marker-end="url(#arR)"/><line x1="544" y1="251.5" x2="544" y2="267.5" stroke="#b71c1c" stroke-width="1.6" marker-end="url(#arR)"/><line x1="546" y1="251.0" x2="690" y2="251.0" stroke="#444" stroke-width="0.9"/><circle cx="546" cy="251.0" r="2" fill="#444"/><text x="694" y="256.0" text-anchor="start" font-size="14" font-weight="normal" fill="#111">frottement négatif G<tspan baseline-shift='sub' font-size='9'>sn</tspan>, vers le bas</text><line x1="496" y1="348" x2="496" y2="324" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#arG)"/><line x1="544" y1="348" x2="544" y2="324" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#arG)"/><line x1="496" y1="416" x2="496" y2="392" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#arG)"/><line x1="544" y1="416" x2="544" y2="392" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#arG)"/><line x1="496" y1="518" x2="496" y2="494" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#arG)"/><line x1="544" y1="518" x2="544" y2="494" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#arG)"/><line x1="496" y1="586" x2="496" y2="562" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#arG)"/><line x1="544" y1="586" x2="544" y2="562" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#arG)"/><line x1="496" y1="654" x2="496" y2="630" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#arG)"/><line x1="544" y1="654" x2="544" y2="630" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#arG)"/><line x1="496" y1="722" x2="496" y2="698" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#arG)"/><line x1="544" y1="722" x2="544" y2="698" stroke="#2e7d32" stroke-width="1.6" marker-end="url(#arG)"/><line x1="546" y1="506" x2="690" y2="533.2" stroke="#444" stroke-width="0.9"/><circle cx="546" cy="506" r="2" fill="#444"/><text x="694" y="538.2" text-anchor="start" font-size="14" font-weight="normal" fill="#111">frottement positif : porte le pieu (vers le haut)</text><line x1="520" y1="784" x2="520" y2="748" stroke="#2e7d32" stroke-width="2" marker-end="url(#arG)"/><text x="532" y="774" text-anchor="start" font-size="12" font-weight="normal" fill="#2e7d32">résistance de pointe</text><line x1="400" y1="268" x2="640" y2="268" stroke="#222" stroke-dasharray="6 4"/><text x="150" y="286" text-anchor="start" font-size="12" font-weight="normal" fill="#111">point neutre : bas de l'argile</text><text x="40" y="821.0" text-anchor="start" font-size="13" font-weight="normal" fill="#111">Le frottement négatif s'ajoute aux charges du pieu, et le frottement positif n'est compté que sous le point neutre (manuel, § 15.7). Hauteurs non à l'échelle.</text></svg>