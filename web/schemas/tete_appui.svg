<text x="40" y="40" text-anchor="start" font-size="15" font-weight="bold" fill="#111">Tête d'appui — coupe perpendiculaire à la ligne d'appui (schéma de principe)</text><rect x="80" y="110" width="720.0" height="80" fill="url(#beton)" stroke="#222" stroke-width="1.5"/><text x="90" y="156" text-anchor="start" font-size="14" font-weight="normal" fill="#111">dalle (tablier)</text><rect x="365.0" y="190" width="150.0" height="36.0" fill="url(#elast)" stroke="#222" stroke-width="1.4"/><line x1="370.0" y1="194.0" x2="510.0" y2="194.0" stroke="#555" stroke-width="2"/><line x1="370.0" y1="201.0" x2="510.0" y2="201.0" stroke="#555" stroke-width="2"/><line x1="370.0" y1="208.0" x2="510.0" y2="208.0" stroke="#555" stroke-width="2"/><line x1="370.0" y1="215.0" x2="510.0" y2="215.0" stroke="#555" stroke-width="2"/><line x1="370.0" y1="222.0" x2="510.0" y2="222.0" stroke="#555" stroke-width="2"/><rect x="305.0" y="226.0" width="270.0" height="60.0" fill="url(#beton)" stroke="#222" stroke-width="1.4"/><path d="M230,286.0 L650.0,286.0 L650.0,526.0 M230,286.0 L230,526.0" fill="none" stroke="#222" stroke-width="1.5"/><rect x="230" y="286.0" width="420.0" height="240.0" fill="url(#beton)" stroke="none"/><path d="M220,526.0 q115.0,-14 220.0,0 t220.0,0" fill="none" stroke="#222" stroke-width="1"/><line x1="315.0" y1="238.0" x2="565.0" y2="238.0" stroke="#c00" stroke-width="2.4"/><line x1="315.0" y1="256.0" x2="565.0" y2="256.0" stroke="#c00" stroke-width="2.4"/><line x1="315.0" y1="274.0" x2="565.0" y2="274.0" stroke="#c00" stroke-width="2.4"/><line x1="242" y1="306.0" x2="638.0" y2="306.0" stroke="#c00" stroke-width="2.4" stroke-dasharray="10 5"/><line x1="242" y1="328.0" x2="638.0" y2="328.0" stroke="#c00" stroke-width="2.4" stroke-dasharray="10 5"/><line x1="488.0" y1="208.0" x2="770.0" y2="160" stroke="#444" stroke-width="0.9"/><circle cx="488.0" cy="208.0" r="2" fill="#444"/><text x="774.0" y="165" text-anchor="start" font-size="14" font-weight="normal" fill="#111">appareil d'appui