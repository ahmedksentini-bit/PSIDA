<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="612" viewBox="0 0 1500 612" font-family="Liberation Sans, Arial, sans-serif" font-size="14">
<defs>
<pattern id="beton" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#f2f2f2"/><circle cx="2" cy="2" r="0.9" fill="#999"/><circle cx="6" cy="5.5" r="0.7" fill="#999"/></pattern>
<pattern id="hach" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="7" stroke="#666" stroke-width="1"/></pattern>
<pattern id="elast" width="6" height="6" patternUnits="userSpaceOnUse"><rect width="6" height="6" fill="#dfe8f3"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker><marker id="arR" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b71c1c"/></marker><marker id="arG" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d32"/></marker><marker id="arB" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7a6a4f"/></marker>
<marker id="tk" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M2,8 L8,2" stroke="#222" stroke-width="1.4"/></marker>
</defs><rect width="100%" height="100%" fill="white"/>
<text x="40" y="34" text-anchor="start" font-size="16" font-weight="bold" fill="#111">Pieux verticaux ou inclinés : comment le groupe reprend un effort horizontal H</text><text x="60" y="72" text-anchor="start" font-size="14" font-weight="bold" fill="#111">a) pieux verticaux</text><rect x="100" y="110" width="260" height="40" fill="url(#beton)" stroke="#222"/><line x1="230" y1="84" x2="230" y2="106" stroke="#222" stroke-width="3" marker-end="url(#ar)"/><text x="240" y="100" text-anchor="start" font-size="13" font-weight="bold" fill="#111">V</text><line x1="360" y1="128" x2="440" y2="128" stroke="#b71c1c" stroke-width="3" marker-end="url(#ar)"/><text x="400" y="120" text-anchor="start" font-size="13" font-weight="bold" fill="#b71c1c">H</text><line x1="165" y1="150" x2="165.0" y2="450.0" stroke="#555" stroke-width="22" stroke-linecap="butt" opacity="0.55"/><line x1="295" y1="150" x2="295.0" y2="450.0" stroke="#555" stroke-width="22" stroke-linecap="butt" opacity="0.55"/><text x="80" y="500" text-anchor="start" font-size="13" font-weight="normal" fill="#111">H est repris par la flexion des pieux</text><text x="80" y="518" text-anchor="start" font-size="13" font-weight="normal" fill="#111">et la réaction latérale du sol (manuel, § 15.5).</text><text x="560" y="72" text-anchor="start" font-size="14" font-weight="bold" fill="#111">b) files inclinées de ω vers l'extérieur</text><rect x="600" y="110" width="260" height="40" fill="url(#beton)" stroke="#222"/><line x1="730" y1="84" x2="730" y2="106" stroke="#222" stroke-width="3" marker-end="url(#ar)"/><text x="740" y="100" text-anchor="start" font-size="13" font-weight="bold" fill="#111">V</text><line x1="860" y1="128" x2="940" y2="128" stroke="#b71c1c" stroke-width="3" marker-end="url(#ar)"/><text x="900" y="120" text-anchor="start" font-size="13" font-weight="bold" fill="#b71c1c">H</text><line x1="665" y1="150" x2="602.6264927546722" y2="443.4442802201417" stroke="#555" stroke-width="22" stroke-linecap="butt" opacity="0.55"/><line x1="795" y1="150" x2="857.3735072453278" y2="443.4442802201417" stroke="#555" stroke-width="22" stroke-linecap="butt" opacity="0.55"/><line x1="795" y1="150" x2="795" y2="400" stroke="#9a5b00" stroke-dasharray="4 3"/><path d="M795,350 A200,200 0 0 0 836.5823381635519,345.62952014676114" fill="none" stroke="#9a5b00" stroke-width="2.5"/><text x="817" y="384" text-anchor="middle" font-size="16" font-weight="bold" fill="#9a5b00">ω</text><text x="580" y="500" text-anchor="start" font-size="13" font-weight="normal" fill="#111">La file dont le pied est du côté vers lequel pointe H</text><text x="580" y="518" text-anchor="start" font-size="13" font-weight="normal" fill="#111">est plus comprimée ; l'autre l'est moins, voire tendue.</text><text x="580" y="536" text-anchor="start" font-size="13" font-weight="normal" fill="#111">Les pieux travaillent surtout en traction-compression.</text><text x="1130" y="80" text-anchor="start" font-size="14" font-weight="bold" fill="#111">c) composition des efforts</text><line x1="1150" y1="180" x2="1270" y2="180" stroke="#b71c1c" stroke-width="3" marker-end="url(#ar)"/><text x="1200" y="172" text-anchor="start" font-size="13" font-weight="normal" fill="#b71c1c">H</text><line x1="1270" y1="180" x2="1270" y2="380" stroke="#222" stroke-width="3" marker-end="url(#ar)"/><text x="1278" y="280" text-anchor="start" font-size="13" font-weight="normal" fill="#111">V</text><line x1="1150" y1="180" x2="1270" y2="380" stroke="#2e7d32" stroke-width="3" marker-end="url(#arG)"/><text x="1194" y="298" text-anchor="end" font-size="15" font-weight="bold" fill="#2e7d32">R</text><text x="1130" y="430" text-anchor="start" font-size="12" font-weight="normal" fill="#111">Si tan ω est voisin de H/V, R est presque</text><text x="1130" y="446" text-anchor="start" font-size="12" font-weight="normal" fill="#111">parallèle aux pieux : l'effort passe en effort</text><text x="1130" y="462" text-anchor="start" font-size="12" font-weight="normal" fill="#111">normal ; flexion et moment en tête diminuent.</text><text x="40" y="570" text-anchor="start" font-size="13" font-weight="normal" fill="#111">Dans PSIDA : champ « Inclinaison des files » (une valeur en degrés par file, positive vers l'extérieur ; vide = pieux verticaux). </text><text x="40" y="592" text-anchor="start" font-size="13" font-weight="normal" fill="#111">PSIDA avertit si H/V > 0,20 (PP73 § 1.1.3) : envisager des pieux inclinés.</text></svg>