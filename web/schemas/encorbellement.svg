<text x="40" y="40" text-anchor="start" font-size="15" font-weight="bold" fill="#111">Encorbellement — coupe transversale (schéma de principe)</text><polygon points="190,300 330,300 330,482.0 190,482.0" fill="url(#beton)" stroke="#222" stroke-width="1.5"/><text x="200" y="504.0" text-anchor="start" font-size="14" font-weight="normal" fill="#111">nervure (dalle)</text><polygon points="330,300 980.0,300 980.0,365.0 330,417.0" fill="url(#beton)" stroke="#222" stroke-width="1.5"/><line x1="330" y1="270" x2="330" y2="508.0" stroke="#c00" stroke-dasharray="8 5" stroke-width="1.2"/><text x="336" y="524.0" text-anchor="start" font-size="14" font-weight="normal" fill="#c00">section d'encastrement (nu)</text><rect x="190" y="279.2" width="400.0" height="20.8" fill="#444" opacity="0.75"/><text x="195" y="271.2" text-anchor="start" font-size="14" font-weight="normal" fill="#111">chaussée (empiètement éventuel)</text><rect x="590.0" y="248.0" width="325.0" height="52.0" fill="#e6e6e6" stroke="#222"/><text x="621.2" y="240.0" text-anchor="start" font-size="14" font-weight="normal" fill="#111">trottoir de x1 à x2</text><rect x="915.0" y="222.0" width="65.0" height="143.0" fill="url(#hach)" stroke="#222"/><line x1="941.0" y1="70" x2="941.0" y2="222.0" stroke="#222" stroke-width="2" marker-end="url(#ar)"/><text x="949.0" y="64" text-anchor="end" font-size="14" font-weight="normal" fill="#111">charge linéique g à x (corniche, barrière)</text><line x1="460.0" y1="70" x2="460.0" y2="279.2" stroke="#1f5fbf" stroke-width="2.5" marker-end="url(#ar)"/><text x="468.0" y="90" text-anchor="start" font-size="14" font-weight="normal" fill="#1f5fbf">roue du tandem TS</text><polygon points="408.0,279.2 512.0,279.2 588.7,355.9 331.3,355.9" fill="#1f5fbf" opacity="0.15" stroke="#1f5fbf" stroke-dasharray="4 3"/><line x1="525.0" y1="341.6" x2="525.0" y2="471.6" stroke="#444" stroke-width="0.9"/><circle cx="525.0" cy="341.6" r="2" fill="#444"/><text x="529.0" y="476.6" text-anchor="start" font-size="14" font-weight="normal" fill="#111">diffusion à 45° jusqu'au feuillet moyen : largeur b₀</text><line x1="330" y1="542.0" x2="330.0" y2="542.0" stroke="#888" stroke-width="0.8"/><line x1="980.0" y1="542.0" x2="980.0" y2="542.0" stroke="#888" stroke-width="0.8"/><line x1="330.0" y1="542.0" x2="980.0" y2="542.0" stroke="#222" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="655.0" y="536.0" text-anchor="middle" font-size="13" transform="rotate(0.0 655.0 536.0)" fill="#111">longueur L<tspan baseline-shift="sub" font-size="10">c</tspan></text><line x1="330" y1="150" x2="330.0" y2="150.0" stroke="#888" stroke-width="0.8"/><line x1="460.0" y1="150" x2="460.0" y2="150.0" stroke="#888" stroke-width="0.8"/><line x1="330.0" y1="150.0" x2="460.0" y2="150.0" stroke="#222" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="395.0" y="144.0" text-anchor="middle" font-size="13" transform="rotate(0.0 395.0 144.0)" fill="#111">x</text><line x1="160" y1="300" x2="160" y2="417.0" stroke="#222" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="152" y="363.5" text-anchor="end" font-size="14" font-weight="normal" fill="#111">h à l'encastrement</text><line x1="160" y1="300" x2="190" y2="300" stroke="#888" stroke-width="0.8"/><line x1="160" y1="417.0" x2="330" y2="417.0" stroke="#888" stroke-width="0.8" stroke-dasharray="3 3"/><line x1="1020.0" y1="300" x2="1020.0" y2="365.0" stroke="#222" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="1028.0" y="337.5" text-anchor="start" font-size="14" font-weight="normal" fill="#111">h à l'extrémité</text></svg>