<text x="40" y="34" text-anchor="start" font-size="16" font-weight="bold" fill="#111">Semelle sur deux files de pieux : méthode des bielles</text><rect x="220" y="220" width="600" height="180.0" fill="url(#beton)" stroke="#222" stroke-width="1.6"/><rect x="460.0" y="130" width="120.0" height="90" fill="url(#beton)" stroke="#222"/><text x="452.5" y="160" text-anchor="end" font-size="12" font-weight="normal" fill="#111">fût (voile ou mur) de largeur b</text><rect x="280.0" y="391.0" width="120.0" height="110" fill="#d9d9d9" stroke="#222"/><line x1="340.0" y1="570.0" x2="340.0" y2="492.0" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arG)"/><text x="350.0" y="560.0" text-anchor="start" font-size="14" font-weight="bold" fill="#2e7d32">R</text><rect x="640.0" y="391.0" width="120.0" height="110" fill="#d9d9d9" stroke="#222"/><line x1="700.0" y1="570.0" x2="700.0" y2="492.0" stroke="#2e7d32" stroke-width="2.5" marker-end="url(#arG)"/><text x="710.0" y="560.0" text-anchor="start" font-size="14" font-weight="bold" fill="#2e7d32">R</text><line x1="520" y1="80" x2="520" y2="124" stroke="#222" stroke-width="3.5" marker-end="url(#ar)"/><text x="528" y="100" text-anchor="start" font-size="14" font-weight="bold" fill="#111">N</text><polygon points="481.8606591926446,212.60059926604058 331.8606591926446,377.60059926604055 348.1393408073554,392.39940073395945 498.1393408073554,227.39940073395942" fill="#a5d6a7" opacity="0.8" stroke="#2e7d32"/><line x1="490.0" y1="220" x2="340.0" y2="385.0" stroke="#2e7d32" stroke-width="1" stroke-dasharray="5 3"/><circle cx="490.0" cy="220" r="3.5" fill="#2e7d32"/><polygon points="541.8606591926446,227.39940073395942 691.8606591926446,392.39940073395945 708.1393408073554,377.60059926604055 558.1393408073554,212.60059926604058" fill="#a5d6a7" opacity="0.8" stroke="#2e7d32"/><line x1="550.0" y1="220" x2="700.0" y2="385.0" stroke="#2e7d32" stroke-width="1" stroke-dasharray="5 3"/><circle cx="550.0" cy="220" r="3.5" fill="#2e7d32"/><line x1="287.5" y1="385.0" x2="752.5" y2="385.0" stroke="#b71c1c" stroke-width="4"/><text x="467.5" y="424.0" text-anchor="start" font-size="13" font-weight="normal" fill="#b71c1c">tirant A₁</text><line x1="550.0" y1="190" x2="550.0" y2="385.0" stroke="#888" stroke-dasharray="4 3"/><line x1="550.0" y1="198" x2="700.0" y2="198" stroke="#222" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="707.5" y="203" text-anchor="start" font-size="13" font-weight="normal" fill="#111">l/2 − b/4</text><line x1="700.0" y1="190" x2="700.0" y2="385.0" stroke="#888" stroke-dasharray="4 3"/><line x1="340.0" y1="600.0" x2="340.0" y2="600.0" stroke="#888" stroke-width="0.8"/><line x1="700.0" y1="600.0" x2="700.0" y2="600.0" stroke="#888" stroke-width="0.8"/><line x1="340.0" y1="600.0" x2="700.0" y2="600.0" stroke="#222" stroke-width="1" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="520.0" y="594.0" text-anchor="middle" font-size="13" transform="rotate(0.0 520.0 594.0)" fill="#111">l (entraxe des files)</text><line x1="190" y1="220" x2="190" y2="385.0" stroke="#222" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="184" y="307.5" text-anchor="end" font-size="13" font-weight="normal" fill="#111">h</text><line x1="850" y1="220" x2="850" y2="400.0" stroke="#222" marker-start="url(#ar)" marker-end="url(#ar)"/><text x="856" y="315.0" text-anchor="start" font-size="13" font-weight="normal" fill="#111">h<tspan baseline-shift='sub' font-size='9'>s</tspan></text><path d="M640.0,385.0 A60,60 0 0 1 659.6396323602213,340.6035955962434" fill="none" stroke="#9a5b00" stroke-width="2"/><text x="495.0" y="371.0" text-anchor="start" font-size="13" font-weight="normal" fill="#9a5b00">θ</text><text x="220" y="652.0" text-anchor="start" font-size="13" font-weight="normal" fill="#111">Les bielles partent de deux points situés à b/4 de part et d'autre de l'axe du mur. tan θ = h / (l/2 − b/4) ; il faut θ ≥ 45° (h : bras de levier, du dessus de la semelle au tirant).</text><text x="220" y="674.0" text-anchor="start" font-size="13" font-weight="normal" fill="#111">A₁ = R (l/2 − b/4) / (h σₛ) par couple de pieux : R réaction du pieu le plus chargé, σₛ contrainte limite de l'acier (manuel, § 15.11).</text></svg>