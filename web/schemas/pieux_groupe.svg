ormal" fill="#111">Débord de la semelle : 1 Ø de l'axe d'une file au bord (sens longitudinal) ; L/2m (sens transversal), avec m pieux par file.</text><text x="1000" y="90" text-anchor="start" font-size="14" font-weight="bold" fill="#111">b) coupe perpendiculaire à la ligne d'appui</text><rect x="996.96" y="240" width="366.08000000000004" height="52" fill="#c9b28f" opacity="0.7"/><text x="1371.04" y="271.0" text-anchor="start" font-size="12" font-weight="normal" fill="#111">couche 1</text><rect x="996.96" y="292" width="366.08000000000004" height="156" fill="#efe0a8" opacity="0.7"/><text x="1371.04" y="375.0" text-anchor="start" font-size="12" font-weight="normal" fill="#111">couche 2</text><rect x="996.96" y="448" width="366.08000000000004" height="265.2" fill="#b9c4c9" opacity="0.7"/><text x="1371.04" y="585.6" text-anchor="start" font-size="12" font-weight="normal" fill="#111">couche porteuse</text><line x1="996.96" y1="240" x2="1363.04" y2="240" stroke="#7a6a4f" stroke-width="2"/><text x="996.96" y="234" text-anchor="start" font-size="11" font-weight="normal" fill="#111">terrain naturel</text><rect x="1065.6" y="234.8" width="228.8" height="31.2" fill="url(#beton)" stroke="#222" stroke-width="1.6"/><rect x="1162.84" y="154.8" width="34.32" height="80" fill="url(#beton)" stroke="#222"/><text x="1157.12" y="194.8" text-anchor="end" font-size="12" font-weight="normal" fill="#111">voile</text><rect x="1088.48" y="264.44" width="45.760000000000005" height="391.56" fill="#d9d9d9" stroke="#222"/><rect x="1225.76" y="264.44" width="45.760000000000005" height="391.56" fill="#d9d9d9" stroke="#222"/><line x1="1169.704" y1="234.8" x2="1111.36" y2="263.14" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 3"/><line x1="1190.296" y1="234.8" x2="1248.64" y2="263.14" stroke="#2e7d32" stroke-width="2" stroke-dasharray="6 3"/><line x1="1082.76" y1="263.14" x2="1277.24" y2="263.14" stroke="#b71c1c" stroke-width="2"/><line x1="1222.9" y1="250.4" x2="1328.72" y2="156.8" stroke="#